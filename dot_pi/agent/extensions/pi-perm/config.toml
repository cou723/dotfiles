version = 1
activePermissionProfile = "workspace"

[profiles.workspace]
description = "編集可 / 通信禁止"
[profiles.":read-only"]
description = "読み取り専用 / 通信禁止"
[profiles.workspace-network]
description = "編集可 / npm・GitHub API のみ通信可"
[profiles.":workspace"]
description = "上流標準: 編集可 / 通信禁止"
[profiles.":workspace-network"]
description = "上流標準: 編集可 / ネットワーク有効"
[profiles.":danger-full-access"]
description = "危険: 全ファイル読書き・通信許可"

[permissions.workspace-network.filesystem]
":minimal" = "read"
[permissions.workspace-network.filesystem.":workspace_roots"]
"." = "write"
".git" = "read"
".codex" = "read"
".agents" = "read"
"**/*.env" = "deny"
".env" = "deny"
".env.*" = "deny"
".git/hooks/**" = "deny"
[permissions.workspace-network.filesystem.":tmpdir"]
"." = "write"
[permissions.workspace-network.filesystem.":slash_tmp"]
"." = "write"
[permissions.workspace-network.network]
enabled = true
allowLocalBinding = false
[permissions.workspace-network.network.domains]
"registry.npmjs.org" = "allow"
"api.github.com" = "allow"

# pi-perm defaults protect read/write/edit. Also gate built-in file inspection tools.
[tools.ls]
mode = "enforce"
defaultAction = "confirm"
pathFields = ["path"]
[tools.find]
mode = "enforce"
defaultAction = "confirm"
pathFields = ["path"]
[tools.grep]
mode = "enforce"
defaultAction = "confirm"
pathFields = ["path"]
